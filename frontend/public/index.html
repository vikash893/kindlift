<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- ✅ Favicon (IMPORTANT - replace favicon.ico with your logo) -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- ✅ Apple Icon -->
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

  <!-- ✅ Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ Theme -->
  <meta name="theme-color" content="#000000" />

  <!-- ✅ SEO Title -->
  <title>KindLift – Smart Ride Sharing Platform</title>

  <!-- ✅ SEO Description -->
  <meta
    name="description"
    content="KindLift is a smart ride sharing platform that helps users find rides easily. Fast, secure and scalable solution for modern travel."
  />

  <!-- ✅ Open Graph (for Google & sharing) -->
  <meta property="og:title" content="KindLift – Smart Ride Sharing Platform" />
  <meta property="og:description" content="Find and share rides easily with KindLift. Fast, secure and intelligent platform." />
  <meta property="og:image" content="https://kindlift.in/logo.png" />
  <meta property="og:url" content="https://kindlift.in" />
  <meta property="og:type" content="website" />

  <!-- ✅ Organization Schema (helps Google logo update faster) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "KindLift",
    "url": "https://kindlift.in",
    "logo": "https://kindlift.in/logo.png"
  }
  </script>

  <!-- ✅ Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
